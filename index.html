<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kutulama kartı</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#1d2433}
.k{max-width:400px;margin:0 auto;padding:8px 10px 12px}
h1{font-size:18px;margin:2px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #e5e9ef;font-size:14px}
.row input{width:72px;font-size:17px;padding:4px 6px;text-align:right;border:1px solid #b9c3d1;border-radius:6px}
.d input{width:150px;text-align:left}
.bx{display:flex;gap:4px;align-items:center;flex:none}.bx input.y{width:52px;background:#fffbea}.bx input.h{width:52px;background:#eef6ff}
.cap{display:flex;justify-content:flex-end;gap:4px;font-size:11px;color:#6b7280;padding:2px 0 0}.cap span{text-align:center}
.sep{height:8px}
button{width:100%;margin-top:12px;font-size:19px;font-weight:700;padding:13px;border:0;border-radius:10px;background:#25d366;color:#fff}
button.c{background:#e5e9ef;color:#1d2433;font-size:16px;padding:10px;margin-top:8px}#ok{text-align:center;font-size:13px;color:#15803d;min-height:18px;margin-top:4px}
</style></head><body><div class="k">
<h1>Kutulama · Jysk</h1>
<div class="row d"><span>Tarih</span><input id="tarih" type="date"></div>
<div class="row d"><span>Vardiya</span><input id="vardiya" placeholder="08:00-20:00" oninput="saatDoldur()"></div>
<div class="cap"><span style="width:52px">Revize</span><span style="width:72px">kutu</span></div>
<div id="liste"></div><div class="sep"></div>
<div class="row"><span>Dokuma üretimi (m²)</span><input id="dok" inputmode="decimal"></div>
<div class="row"><span>Konfeksiyon üretimi (m²)</span><input id="konf" inputmode="decimal"></div>
<div class="row"><span>Stok (m²)</span><input id="stok" inputmode="decimal"></div>
<div class="row"><span>Çalışan sayısı</span><input id="kisi" inputmode="numeric"></div>
<div class="row"><span>Çalışma saati</span><input id="saat" inputmode="numeric"></div>
<div class="row"><span>Dünden kalan</span><input id="dun" inputmode="numeric" placeholder="adet"></div>
<div class="row d"><span>Açıklama</span><input id="aciklama" style="width:220px;text-align:left" placeholder="kısa not"></div>
<button onclick="location.href='https://wa.me/?text='+encodeURIComponent(metin())">WhatsApp'a gönder</button>
<button class="c" onclick="kopyala()">Metni kopyala</button><div id="ok"></div>
</div><script>
const K=[["BELLA 140X200 35 Lİ JYSK","140x0200","PALET_35",35],["BELLA 160X230 30 LU JYSK","160x0230","PALET_26",30],["BELLA 200X300 25 Lİ","200x0300","PALET_71",25],["HELSİNKİ 140X200 35 Lİ JYSK","140x0200","PALET_35",35],["HELSİNKİ 160230 35'Lİ JYSK","160x0230","PALET_26",35],["KOS 140X200 30 LU JYSK","140x0200","PALET_35",30],["KOS 160X230 24 LÜ JYSK","160x0230","PALET_26",24],["MAESTRO 140X200 48 Lİ JYSK","140x0200","PALET_35",48],["MAESTRO 160X230 48 Lİ JYSK","160x0230","PALET_26",48],["VİLLEPAL - 230x160 - 30 LU","230x0160","PALET_53",30]]; /* [Ad, Ebat, Kutu Kodu, hali/kutu] */
liste.innerHTML=K.map((k,i)=>`<div class="row"><span>${k[0]}</span><div class="bx"><input class="y" id="y${i}" inputmode="numeric" pattern="[0-9]*" title="Revize (bozuk/eksik kutu)"><input id="k${i}" inputmode="numeric" pattern="[0-9]*" title="Kutu"></div></div>`).join("");
function saatDoldur(){const m=g("vardiya").match(/(\d{1,2})[:.]?\d*\s*-\s*(\d{1,2})/);if(m){saat.value=((+m[2]-+m[1]+24)%24)||24}}
const g=id=>document.getElementById(id).value.trim();
function metin(){let s=`KUTULAMA ${g("tarih").split("-").reverse().join(".")} - Jysk\nVardiya: ${g("vardiya")||"-"}\n`;K.forEach((k,i)=>{const n=g("k"+i),y=g("y"+i);if(n||y)s+=`${k[0]}: ${n||0}${y?" (Revize "+y+")":""}\n`});
s+=`Dokuma: ${g("dok")||"-"} m²\nKonfeksiyon: ${g("konf")||"-"} m²\nStok: ${g("stok")||"-"} m²\nÇalışan: ${g("kisi")||"-"}\nSaat: ${g("saat")||"-"}\nDünden kalan: ${g("dun")||"-"}\nAçıklama: ${g("aciklama")||"-"}`;return s}
{const d=new Date();d.setDate(d.getDate()-1);while(d.getDay()===0)d.setDate(d.getDate()-1);tarih.value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function kopyala(){const t=metin(),bitti=()=>{ok.textContent="Metin kopyalandı. WhatsApp'ta gruba yapıştırın.";};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(bitti,()=>eski(t))}else eski(t);function eski(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");bitti()}catch(e){ok.textContent="Kopyalanamadı"}a.remove()}}
saatDoldur();
</script></body></html>
